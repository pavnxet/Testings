name: Extract Direct Download Links

on:
  workflow_dispatch: # इससे आप GitHub UI से मैन्युअली रन कर सकते हैं
  push:
    paths:
      - 'links.txt' # जब भी आप लिंक्स फ़ाइल अपडेट करेंगे, यह खुद चल पड़ेगा

jobs:
  scrape:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.x'

    - name: Install Dependencies
      run: |
        pip install selenium

    - name: Run Scraper Script
      run: python scraper.py

    - name: Commit and Push Output File
      run: |
        git config --global user.name "github-actions[bot]"
        git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
        git add direct_links.txt
        # अगर कोई बदलाव नहीं हुआ तो एरर न आए, इसलिए || exit 0 लगाया है
        git commit -m "Update direct download links [skip ci]" || exit 0
        git push
