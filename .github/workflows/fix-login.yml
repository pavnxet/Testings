name: Fix login route

on:
  push:
    branches: [Fitgirl-games-extracter]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch worker once
        run: |
          if git log -1 --pretty=%s | grep -Fq 'fix(auth): add GET login route'; then
            echo 'Patch commit already applied.'
            exit 0
          fi
          python - <<'PY'
          from pathlib import Path
          p = Path('worker.js')
          s = p.read_text()
          old = '    // Authentication\n    if (url.pathname === "/login" && request.method === "POST") {'
          new = '    // Authentication\n    if (url.pathname === "/login" && request.method === "GET") {\n      return loginPage();\n    }\n\n    if (url.pathname === "/login" && request.method === "POST") {'
          if old not in s:
              raise SystemExit('login route anchor not found')
          p.write_text(s.replace(old, new, 1))
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add worker.js
          git commit -m 'fix(auth): add GET login route'
          git push
